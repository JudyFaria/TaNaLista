# Blueprint do Render: publica o app com HTTPS e um endereço público.
# Os dados ficam no Firestore (Firebase, gratuito). A chave da conta de serviço
# vai como Secret File (firebase.json); veja o README.
services:
  - type: web
    name: lista-de-compras
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_SECRET_KEY
        generateValue: true
      # Obrigatória: o disco do Render é apagado a cada reinício/deploy. Sem ela,
      # o app se recusa a iniciar (em vez de perder listas e itens em silêncio).
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase.json
