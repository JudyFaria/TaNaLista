# Blueprint do Render: publica o app com HTTPS e um endereço público.
# O banco fica no Neon (PostgreSQL gratuito); cole a URL dele em DATABASE_URL.
services:
  - type: web
    name: lista-de-compras
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
